<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <!-- Tailwind CSS (Play CDN) — 별도 CSS 파일 없이 유틸리티 클래스로만 스타일링한다. -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#48499c',      // 네비게이션 / 강조
                        slateink: '#6c6c8e', // 본문 강조 · 테두리
                        hong: '#ee8f23',     // 로고 "홍"
                        jeon: '#fdcb08',     // 로고 "전"
                    },
                    fontFamily: {
                        sans: ['"Apple SD Gothic Neo"', '"Malgun Gothic"', '"맑은 고딕"', 'system-ui', 'sans-serif'],
                    },
                    keyframes: {
                        fadeup: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'none' } },
                    },
                    animation: { fadeup: 'fadeup .35s ease-out both' },
                },
            },
        };
    </script>

    <!-- display 유틸리티(grid/flex 등)가 UA 기본 [hidden] 규칙을 이겨 버리므로 명시적으로 눌러 준다. -->
    <style>[hidden] { display: none !important; }</style>

    <script type="module" src="/js/app.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-white font-sans text-slate-800 antialiased">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/85 backdrop-blur">
        <nav class="mx-auto flex max-w-[1300px] items-center justify-between gap-3 px-4 py-3 sm:px-6">
            <a href="/intro"
               class="relative shrink-0 text-sm font-semibold text-ink after:absolute after:-bottom-1 after:left-0 after:h-[3px] after:w-0 after:bg-ink after:transition-all after:duration-300 hover:after:w-full sm:text-base">
                본원소개
            </a>

            <a href="/" class="flex min-w-0 items-center gap-1.5 sm:gap-2" aria-label="홍앤전 신경과신경외과 홈">
                <img src="/images/apple.png" alt="" class="h-6 w-auto sm:h-8">
                <span class="truncate text-base font-bold tracking-tight text-slate-700 sm:text-xl">

                진료정보
            </a>
        </nav>

    <!-- 라우터가 /pages/*.html 조각을 여기에 렌더링한다. -->
    <main id="app" class="flex-1"></main>

    <noscript>
        <div class="mx-auto max-w-2xl px-6 py-24 text-lg leading-relaxed text-slateink">
            <h2 class="mb-6 text-2xl font-bold">홍앤전 신경과신경외과</h2>
            <p>

                대구광역시 수성구 범어동 563-4 애플타워 8층<br>
                진료문의 TEL. 053-743-0920 / 053-753-0920<br>

    <!-- 공용 모달 — 장비 설명, 비급여 안내표에서 함께 사용한다. -->
    <div id="modal" hidden class="fixed inset-0 z-50">
        <div data-modal-close class="absolute inset-0 bg-black/50 backdrop-blur-[2px]"></div>
        <div class="relative flex h-full items-center justify-center p-4">
            <div role="dialog" aria-modal="true" aria-labelledby="modal-title"
                 class="flex max-h-[88vh] w-full max-w-2xl animate-fadeup flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
                <div class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4 sm:px-7">
                    <h2 id="modal-title" class="border-l-4 border-slateink pl-3 text-lg font-bold leading-snug text-slate-800 sm:text-xl"></h2>
                    <button type="button" data-modal-close aria-label="닫기"
                            class="-mr-1 shrink-0 rounded-lg p-1.5 text-2xl leading-none text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">

                    </button>
                </div>
                <div id="modal-body" class="overflow-y-auto px-5 py-5 text-[15px] leading-7 text-slate-700 sm:px-7"></div>
                <div class="border-t border-slate-200 px-5 py-3 text-right sm:px-7">
                    <button type="button" data-modal-close
                            class="rounded-lg border-2 border-slateink px-5 py-2 text-sm font-semibold text-slateink transition hover:bg-slateink hover:text-white">

</html>
